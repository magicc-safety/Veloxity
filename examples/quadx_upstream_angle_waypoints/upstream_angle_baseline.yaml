/path_manager:
  ros__parameters:
    # Prevent the path manager from switching legs while the original
    # trajectory is still well short of the waypoint. A very tight tolerance
    # caused a long post-corner dwell, so retain a moderate capture radius.
    waypoint_tolerance: 0.5
    max_velocity: 1.5
    max_acceleration: 1.0

/trajectory_follower:
  ros__parameters:
    # Overdamped lateral velocity response for the angle-mode plant. The
    # companion adapter restores the velocity reference omitted upstream.
    u_n_kp: 1.5
    u_n_ki: 0.01
    u_n_kd: 3.5
    u_e_kp: 1.5
    u_e_ki: 0.01
    u_e_kd: 3.5

/trajectory_velocity_adapter:
  ros__parameters:
    north_kp: 1.5
    north_kd: 3.5
    east_kp: 1.5
    east_kd: 3.5
    down_kp: 4.0
    down_kd: 3.5

/thrust_to_throttle_adapter:
  ros__parameters:
    # Measured normalized hover throttle for this Veloxity standalone model.
    # The upstream 0.65 value makes the altitude integrator carry a 5.5%
    # steady conversion error and produces visibly saggy vertical tracking.
    equilibrium_throttle: 0.686
    min_throttle: 0.40
    max_throttle: 0.85
    max_roll_rad: 0.30
    max_pitch_rad: 0.30
    max_yaw_rate_rad_s: 0.70
