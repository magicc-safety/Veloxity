[package]
name = "sim"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
voloxide_core = { workspace = true }

serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.45" }
zenoh = { version = "1.4" }
cdr = { version = "0.2.4" }
chrono = { version = "0.4" }
critical-section = { version = "1.2.0", features = ["std"] }

[dev-dependencies]

[[bin]]
name = "voloxide"
test = false
bench = false

[lints]
workspace = true
