[package]
name = "pico2w"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[features]
default = []
timing-diagnostics = ["voloxide_core/timing-diagnostics"]
imu-400hz = []
ism330dhcx-driver = ["dep:ism330dhcx-rs"]
ism330dhcx-1k666 = ["ism330dhcx-driver"]
ism330dhcx-3k333 = ["ism330dhcx-driver"]
release-loop-bench = []
release-loop-classifier = ["release-loop-bench"]
release-loop-spike-counter = ["release-loop-bench"]
scope-timing-pins = []
imu-producer-scope = ["scope-timing-pins"]
pre-control-scope = ["scope-timing-pins", "voloxide_core/pre-control-scope"]
rc-command-scope = ["scope-timing-pins", "voloxide_core/rc-command-scope"]
imu-producer-no-baro = ["imu-producer-scope"]
imu-producer-isolation = ["imu-producer-no-baro"]
imu-producer-interrupt-executor = []
core1-disable-heartbeat = []
core1-disable-mavlink-tx = []
core1-disable-mavlink-rx = []
core1-disable-crsf = []
core1-disable-gps = []
interrupt-executor-smoke = ["imu-producer-scope"]
raw-swi-smoke = ["imu-producer-scope"]
control-scope-estimator = ["voloxide_core/control-scope-estimator"]
control-scope-controller = ["voloxide_core/control-scope-controller"]
control-scope-mixer = ["voloxide_core/control-scope-mixer"]
control-scope-pwm = ["voloxide_core/control-scope-pwm"]
synthetic-imu = []
synthetic-imu-1khz = ["synthetic-imu"]
synthetic-imu-2khz = ["synthetic-imu"]
synthetic-imu-3333hz = ["synthetic-imu"]
synthetic-imu-4khz = ["synthetic-imu"]

[dependencies]
rp2350_platform = { workspace = true }
voloxide_core = { workspace = true }
voloxide_mavlink = { workspace = true }

cortex-m = "0.7.7"
cortex-m-rt = { version = "0.7.0" }
crsf = "2.0.1"
critical-section = "1.2.0"
embassy-executor = { version = "0.10.0" }
embassy-sync = "0.8.0"
embassy-time = "0.5.1"
embedded-hal-nb = "1.0.0"
fixed = "1.31.0"
ism330dhcx-rs = { version = "2.0.0", default-features = false, features = ["async"], optional = true }
nb = "1.1.0"
panic-halt = "1.0.0"
pio = "0.3.0"
static_cell = "2.1"

[lints]
workspace = true

[[bin]]
name = "voloxide"
test = false
bench = false
