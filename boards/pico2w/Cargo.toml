[package]
name = "pico2w"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[features]
default = []
wifi = ["wifi-mavlink"]
wifi-mavlink = []
timing-diagnostics = ["voloxide_core/timing-diagnostics"]
imu-400hz = []
ism330dhcx-driver = ["dep:ism330dhcx-rs"]

[dependencies]
rp2350_platform = { workspace = true }
voloxide_core = { workspace = true }
voloxide_mavlink = { workspace = true }

cortex-m = "0.7.7"
cortex-m-rt = { version = "0.7.0" }
critical-section = "1.2.0"
cyw43 = "0.7.0"
cyw43-pio = "0.10.0"
embassy-executor = { version = "0.10.0", features = [
  "platform-cortex-m",
  "executor-thread",
] }
embassy-futures = "0.1.2"
embassy-net = { version = "0.9.1", features = [
  "dhcpv4",
  "medium-ethernet",
  "proto-ipv4",
  "udp",
] }
embassy-sync = "0.8.0"
embassy-time = "0.5.1"
embedded-hal-nb = "1.0.0"
ism330dhcx-rs = { version = "2.0.0", default-features = false, features = ["async"], optional = true }
nb = "1.1.0"
panic-halt = "1.0.0"
static_cell = "2.1"

[lints]
workspace = true

[[bin]]
name = "voloxide"
test = false
bench = false
