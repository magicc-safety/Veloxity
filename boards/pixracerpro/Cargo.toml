[package]
name = "pixracerpro"
version = "0.1.0"
edition = "2024"

[features]
default = []
legacy-run-once = []
timing-diagnostics = ["voloxide_core/timing-diagnostics"]
scope-timing-pins = ["voloxide_core/scope-timing-pins"]
sensor-poll-diagnostics = []

[dependencies]
stm_32 = { workspace = true }
voloxide_core = { workspace = true }
voloxide_mavlink = { workspace = true }

panic-halt = "1.0.0"

[lints]
workspace = true

[[bin]]
name = "voloxide"
test = false
bench = false
