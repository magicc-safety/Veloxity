[alias]
xtask = "run -p xtask --"

[profile.release]
codegen-units = 1        # No parallel compilation for better optimization
debug = 2                # Include full debug info, even in release builds
debug-assertions = false # Disable runtime checks for speed
incremental = false      # Disable incremental compilation for more stable optimizations
lto = 'fat'              # Enable aggressive Link-Time Optimization
opt-level = 3            # Maximum optimization level
overflow-checks = false  # Disable integer overflow checks for performance

# Your preferred settings for tests (`cargo test`)
[profile.test]
codegen-units = 1
debug = 2
debug-assertions = true
incremental = false
opt-level = 3           # Optimize tests for faster runtime
overflow-checks = true

# Your preferred settings for benchmarks (`cargo bench`)
[profile.bench]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = 3
overflow-checks = false

# Now, add your target-specific settings
[target.thumbv7em-none-eabihf]
runner = "probe-rs run --chip STM32H743IIKx"
rustflags = [
  "-C",
  "linker=rust-lld",
  "-C",
  "link-arg=--nmagic",
  "-C",
  "link-arg=-Tlink.x",
  # "-C",
  # "link-arg=-Tdefmt.x",
]

[target.thumbv8m.main-none-eabihf]
runner = "probe-rs run --chip RP235x"
rustflags = [
  "-C",
  "target-cpu=cortex-m33",
  "-C",
  "linker=rust-lld",
  "-C",
  "link-arg=--nmagic",
  "-C",
  "link-arg=-Tlink.x",
]
